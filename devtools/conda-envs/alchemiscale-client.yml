name: alchemiscale-client
channels:
  - conda-forge

dependencies:
  - pip
  - python=3.12
  - cuda-version >=12

  # alchemiscale dependencies
  - gufe=1.13.1
  - openfe=1.13.0
  - requests
  - click
  - httpx
  - pydantic >2
  - pydantic-settings
  - async-lru
  - zstandard
  - diskcache
  - stratocaster

  ## user client
  - rich

  # openmm protocols
  - feflow=0.2.1

  # additional pins
  - openmm=8.4.0
  - openmmforcefields>=0.14.2

  - pip:
    - git+https://github.com/OpenFreeEnergy/alchemiscale.git@v0.7.2
