[workspace]
name = "alchemiscale"
channels = ["conda-forge"]
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.13.*"
sphinx = "*"
furo = "*"
myst-nb = "*"
myst-parser = ">=0.14"
docutils = "*"
sphinx-notfound-page = "*"
gufe = "==1.10.0"
py2neo = "*"
stratocaster = "*"

[feature.docs.pypi-dependencies]
alchemiscale = { path = ".", editable = true }

[feature.docs.tasks]
docs = "sphinx-build -T -W --keep-going -b html docs docs/_build/html"

[environments]
docs = { features = ["docs"], no-default-feature = true }
